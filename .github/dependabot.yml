version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "digitalservicebund/*"

  - package-ecosystem: "terraform"
    directory: "/test"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
